[pytest]
# Use auto mode so every async test/fixture gets a fresh, properly-managed
# event loop without requiring explicit @pytest.mark.asyncio decorators.
# This eliminates the "RuntimeError: Event loop is closed" errors that occur
# in strict/legacy mode when async fixtures outlive their loop.
asyncio_mode = auto

# Show extra test summary for failures, errors, and warnings
addopts = -ra
